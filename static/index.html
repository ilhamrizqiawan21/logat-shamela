<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logat Syamilah</title><style>
:root{--p:#fffdf6;--bg:#efeee7;--l:#d6d4cc;--i:#30352f;--m:#778078;--g:#23594c;--r:#8d211d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px system-ui}header{height:68px;padding:0 5%;display:flex;align-items:center;background:#fbfbf8;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{margin-right:auto;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:9px;background:var(--g);color:#fff;font-size:20px}.brand b{font-size:17px}.brand small{display:block;color:var(--m)}nav{height:100%;display:flex}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:0 17px}.tab.active{color:var(--r);border-color:var(--r);font-weight:bold}.shell{max-width:1280px;margin:auto;padding:24px}.view{display:none}.view.active{display:block}.panel{background:#fff;border:1px solid var(--l);padding:18px}.head{margin:0 0 7px;color:var(--r);font-size:19px}.hint{margin:0 0 15px;color:var(--m)}input,button{font:inherit}.kitab-layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.filter{background:#fff;border:1px solid var(--l);padding:12px;height:max-content}.filter-tabs{display:flex;border-bottom:1px solid var(--l);margin-bottom:10px}.filter-tabs button{flex:1;border:0;background:none;padding:9px}.filter-tabs .active{color:var(--r);border-bottom:2px solid var(--r)}.filter input,.catalogq{width:100%;padding:10px;border:1px solid var(--l);direction:rtl}.filter-items{max-height:62vh;overflow:auto}.filter-item{width:100%;border:0;border-bottom:1px solid #eee;background:none;padding:9px;text-align:right;direction:rtl}.filter-item:hover,.filter-item.active{background:#f2eee4}.filter-item small{color:var(--m)}.section-title{margin:20px 0 8px;color:#9a6a25;font-size:13px}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));border-top:1px solid #e8e7e2}.book{border:0;border-bottom:1px solid #e8e7e2;background:none;padding:12px;text-align:right;direction:rtl}.book:hover{background:#f2eee4}.book small{display:block;color:var(--m);margin-top:4px}.hero{padding:21px 26px;background:linear-gradient(135deg,#225d4f,#397867);color:#fff}.hero h1{margin:0 0 5px;direction:rtl;font:25px "Noto Naskh Arabic",serif}.hero p{margin:0;color:#dfece5}.bar{display:flex;gap:8px;align-items:center;margin:14px 0}.bar button,.bar input{padding:9px;border:1px solid var(--l);background:#fff}.bar input{width:66px}.indexopen{margin-left:auto}.meta{text-align:center;color:var(--m);margin:0 0 9px}.page{max-width:880px;min-height:62vh;margin:auto;padding:clamp(28px,5vw,65px);background:var(--p);border:1px solid var(--l);direction:rtl;text-align:right;white-space:pre-wrap;font:29px/2.15 "Noto Naskh Arabic","Amiri",serif}.token{display:inline;cursor:pointer;padding:0 2px;border-radius:3px}.token:hover{background:#faecb8}.annot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.35;border-bottom:2px dotted #bd8330}.meaning{font:11px system-ui;color:#9b7028;direction:ltr;white-space:nowrap}.searchbox{display:flex;gap:8px;padding:9px;background:#e9e9e4;border:1px solid #c8c8c1;max-width:930px}.searchbox input{flex:1;padding:10px;border:1px solid #bbb;direction:rtl}.searchbox button{background:var(--r);border:0;color:#fff;padding:0 18px}.scope{text-align:right;direction:rtl;color:var(--m)}.results{display:grid;gap:8px;max-width:930px}.result{border:1px solid var(--l);border-right:4px solid var(--r);background:#fff;padding:11px;text-align:right;direction:rtl}.result small{display:block;color:var(--m);margin-top:5px}.empty{padding:40px;text-align:center;color:var(--m);background:#fff;border:1px dashed var(--l)}.empty button{margin-top:11px;padding:9px 14px;border:0;background:var(--g);color:#fff}.index{position:fixed;right:0;top:0;z-index:5;width:min(430px,94vw);height:100vh;background:#fbfbf8;border-left:1px solid #bbb;box-shadow:-8px 0 26px #0003;transform:translateX(102%);transition:.2s;padding:15px;overflow:auto;direction:rtl}.index.open{transform:none}.index h2{color:var(--r);font:21px "Noto Naskh Arabic",serif}.index input{width:100%;padding:9px;border:1px solid #bbb;direction:rtl}.chapter{width:100%;border:0;border-bottom:1px solid #e2e1dc;background:none;padding:9px;text-align:right;font:16px "Noto Naskh Arabic",serif}.chapter small{display:block;color:var(--m);font:11px system-ui}.close{float:left;border:0;background:none;font-size:22px}.editor{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(410px,92vw);background:#fff;border:1px solid var(--l);box-shadow:0 15px 45px #0004;padding:17px;display:none}.editor.open{display:block}.editor input{width:100%;padding:10px;border:1px solid var(--l);margin:10px 0}.editor button{padding:8px 12px;border:1px solid var(--l);background:#fff}.editor .save{background:var(--g);color:#fff}.error{color:#a22;margin:10px 0}@media(max-width:700px){.kitab-layout{display:block}.filter{margin-bottom:12px}.filter-items{max-height:26vh}.shell{padding:12px}.brand small{display:none}.tab{padding:0 9px}.page{padding:23px;font-size:23px}}
</style><body><header><div class="brand"><div class="mark">ل</div><div><b>Logat Syamilah</b><small>Ruang belajar kitab</small></div></div><nav><button class="tab active" data-v="books">Kitab</button><button class="tab" data-v="reader">Baca</button><button class="tab" data-v="search">Cari</button></nav></header><main class="shell"><section id="books" class="view active"><div class="kitab-layout"><aside class="filter"><div class="filter-tabs"><button class="ft active" data-f="category">Fan Ilmu</button><button class="ft" data-f="author">Musonnif</button></div><input id="fq" placeholder="Cari indeks…"><div id="filters" class="filter-items"></div></aside><div class="panel"><h1 class="head">Pilih Kitab</h1><p id="filterName" class="hint">Pilih Fan Ilmu atau Musonnif dari indeks samping.</p><input id="qbook" class="catalogq" placeholder="Cari kitab…"><div class="section-title" id="recentTitle"></div><div id="recent" class="books"></div><div class="section-title">KOLEKSI KITAB</div><div id="list" class="books"></div></div></div></section><section id="reader" class="view"><div id="rnone" class="empty">Belum ada kitab aktif.<br><button data-go="books">Pilih kitab</button></div><div id="rcontent" hidden><div class="hero"><h1 id="title"></h1><p id="author"></p></div><div class="bar"><button id="prev">← Sebelumnya</button><label>Halaman <input id="page" type="number" min="1" value="1"></label><button id="next">Berikutnya →</button><button id="openIndex" class="indexopen">☷ Indeks kitab</button></div><div id="meta" class="meta"></div><article id="text" class="page"></article></div></section><section id="search" class="view"><div id="snone" class="empty">Pilih kitab terlebih dahulu.<br><button data-go="books">Pilih kitab</button></div><div id="scontent" hidden><h1 class="head">Cari Isi Kitab</h1><p id="scope" class="scope"></p><div class="searchbox"><input id="query" placeholder='Kata atau frasa persis, mis. &quot;رسول الله&quot;'><button id="go">بحث</button></div><div id="results" class="results"></div></div></section><div id="error" class="error"></div></main><aside id="index" class="index"><button id="close" class="close">×</button><h2>فهرس الكتاب — Indeks kitab</h2><input id="iq" placeholder="Cari judul bab…"><div id="chapters"></div></aside><div id="editor" class="editor"><b>Tambahkan logat untuk: <span id="word"></span></b><input id="meaning" placeholder="Arti / logat kata"><div><button id="cancel">Batal</button><button id="remove">Hapus</button><button id="save" class="save">Simpan</button></div></div><script>
const $=s=>document.querySelector(s),S={book:null,page:1,index:[],filterMode:'category',filter:null,selected:null,data:null},K='logat-recent-books',esc=x=>{let d=document.createElement('i');d.textContent=x||'';return d.innerHTML};let timer;async function api(u){let r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('#rnone').hidden=!!S.book;$('#rcontent').hidden=!S.book;$('#snone').hidden=!!S.book;$('#scontent').hidden=!S.book;if(v==='reader'&&S.book&&!$('#text').textContent)load();if(v==='search'&&S.book)$('#scope').textContent='Mencari hanya di kitab: '+S.book.name}function saved(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function remember(){let a=saved().filter(x=>x.id!==S.book.id);a.unshift({id:S.book.id,name:S.book.name,authors:S.book.authors,page:S.page});localStorage.setItem(K,JSON.stringify(a.slice(0,8)));recent()}function choose(x,page=1){S.book=x;S.page=page;S.index=[];$('#page').value=page;$('#text').textContent='';$('#results').innerHTML='';show('reader');load();loadIndex()}function recent(){let a=saved();$('#recentTitle').textContent=a.length?'TERAKHIR DIBACA':'';$('#recent').innerHTML=a.map(x=>`<button class="book" data-i="${x.id}"><b>${esc(x.name)}</b><small>Halaman ${x.page} · ${esc(x.authors)}</small></button>`).join('');$('#recent').querySelectorAll('.book').forEach(b=>b.onclick=()=>choose(a.find(x=>x.id==b.dataset.i),a.find(x=>x.id==b.dataset.i).page))}async function filters(){let p=S.filterMode==='category'?'/api/categories':'/api/authors';let a=await api(p+'?q='+encodeURIComponent($('#fq').value));$('#filters').innerHTML=a.map(x=>`<button class="filter-item ${S.filter?.id==x.id?'active':''}" data-i="${x.id}"><b>${esc(x.name)}</b> <small>(${x.count})</small></button>`).join('');$('#filters').querySelectorAll('.filter-item').forEach(b=>b.onclick=()=>{S.filter=a.find(x=>x.id==b.dataset.i);$('#filterName').textContent=S.filterMode==='category'?'Fan Ilmu: '+S.filter.name:'Musonnif: '+S.filter.name;books()})}async function books(){let u='/api/books?q='+encodeURIComponent($('#qbook').value);if(S.filter)u+='&'+(S.filterMode==='category'?'category':'author')+'='+S.filter.id;let a=await api(u);$('#list').innerHTML=a.map(x=>`<button class="book" data-i="${x.id}"><b>${esc(x.name)}</b><small>${esc(x.authors||'Musonnif tidak tercatat')}</small></button>`).join('')||'<div class="empty">Kitab tidak ditemukan.</div>';$('#list').querySelectorAll('.book').forEach(b=>b.onclick=()=>choose(a.find(x=>x.id==b.dataset.i)))}async function load(){try{let d=await api(`/api/page?book_id=${S.book.id}&page_id=${S.page}`);S.data=d;$('#text').textContent='';d.tokens.forEach(t=>{if(!t.word)return $('#text').append(t.text);let s=document.createElement('span'),a=d.annotations[String(t.index)];s.className='token';s.textContent=t.text;if(a){s.classList.add('annot');let m=document.createElement('small');m.className='meaning';m.textContent=a.meaning;s.append(m)}s.onclick=()=>edit(t);$('#text').append(s)});S.book.name=d.book_name;S.book.authors=d.authors||'';$('#title').textContent=d.book_name;$('#author').textContent=S.book.authors||'Musonnif tidak tercatat';$('#meta').textContent=`Jilid ${d.part||'–'} · Halaman cetak ${d.printed_page||'–'} · Halaman ${d.page_id}`;remember()}catch(e){$('#error').textContent=e.message}}function edit(t){S.selected=t;$('#word').textContent=t.text;$('#meaning').value=S.data.annotations[String(t.index)]?.meaning||'';$('#editor').classList.add('open');$('#meaning').focus()}async function save(){await fetch('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book_id:S.book.id,page_id:S.page,word_index:S.selected.index,word:S.selected.text,meaning:$('#meaning').value})});$('#editor').classList.remove('open');load()}async function loadIndex(){S.index=await api('/api/index?book_id='+S.book.id);chapters()}function chapters(){let a=S.index.filter(x=>x.title.toLowerCase().includes($('#iq').value.toLowerCase())),e=$('#chapters');e.innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.className='chapter';b.innerHTML=`${esc(x.title)}<small>Halaman ${x.page_id}</small>`;b.onclick=()=>{S.page=x.page_id;$('#page').value=S.page;$('#index').classList.remove('open');load()};e.append(b)})}async function search(){let q=$('#query').value.trim();if(!q)return;let d=await api(`/api/search?q=${encodeURIComponent(q)}&book_id=${S.book.id}`),a=d.results||[];$('#results').innerHTML=a.map(x=>`<button class="result" data-p="${x.page_id}"><b>${esc(x.book_name)}</b><small>${x.snippet_body||''}</small></button>`).join('')||'<div class="empty">Tidak ada hasil.</div>';$('#results').querySelectorAll('.result').forEach(b=>b.onclick=()=>{S.page=+b.dataset.p;show('reader');load()})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));document.querySelectorAll('.ft').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ft').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.filterMode=b.dataset.f;S.filter=null;filters();books()});$('#fq').oninput=()=>{clearTimeout(timer);timer=setTimeout(filters,180)};$('#qbook').oninput=()=>{clearTimeout(timer);timer=setTimeout(books,180)};$('#prev').onclick=()=>{S.page=Math.max(1,S.page-1);$('#page').value=S.page;load()};$('#next').onclick=()=>{S.page++;$('#page').value=S.page;load()};$('#page').onchange=()=>{S.page=Math.max(1,+$('#page').value||1);load()};$('#openIndex').onclick=()=>$('#index').classList.add('open');$('#close').onclick=()=>$('#index').classList.remove('open');$('#iq').oninput=chapters;$('#go').onclick=search;$('#query').onkeydown=e=>e.key==='Enter'&&search();$('#save').onclick=save;$('#remove').onclick=()=>{$('#meaning').value='';save()};$('#cancel').onclick=()=>$('#editor').classList.remove('open');recent();filters();books();
</script></body></html>
